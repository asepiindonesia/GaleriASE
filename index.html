<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALERI SERVICE A.S.E</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 0;
    background: url('images/background.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #000;
    user-select: none;
}

/* Header */
h1 {
    text-align: center;
    font-size: 2rem;
    color: #00fff2;
    margin-bottom: 20px;
}

/* Grid Foto */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(3cm, 1fr));
    gap: 10px;
    justify-items: center;
    padding: 0 10px;
}

.gallery-grid img {
    width: 3cm;
    height: 2cm;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid #888888;
    background-color: rgba(255,255,255,0.05);
    pointer-events: auto;
    user-drag: none;
    -webkit-user-drag: none;
}

/* Tombol MENU HIBURAN */
.btn-menu {
    display: block;
    margin: 20px auto;
    padding: 12px 25px;
    border-radius: 10px;
    background: rgba(31, 41, 55, 0.8);
    color: #00fff2;
    font-weight: bold;
    text-align: center;
    width: 60%; 
    border: 1px solid #00fff2;
    text-decoration: none;
}

.btn-menu:hover {
    background: rgba(31, 41, 55, 1);
}

/* Separator dan Footer */
.hr-separator {
    border-top: 1px solid #444;
    margin: 20px 0;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #000;
    margin-top: 20px;
}

/* Modal Zoom + Watermark Diagonal */
.modal {
    display: none;
    position: fixed;
    z-index: 50;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.modal-content {
    position: relative;
}

.modal img {
    max-width: 50%;
    max-height: 50%;
    border-radius: 10px;
    display: block;
}

/* Watermark miring diagonal bergerak */
.watermark {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    color: rgba(255,255,255,0.15);
    font-size: 1.5rem;
    font-weight: 700;
    transform: rotate(-45deg);
    white-space: nowrap;
    animation: watermarkMove 6s linear infinite alternate;
}

@keyframes watermarkMove {
    0% { transform: rotate(-45deg) translate(0,0); }
    100% { transform: rotate(-45deg) translate(20px,20px); }
}
</style>
</head>
<body oncontextmenu="return false;" onkeydown="return false;" ondragstart="return false;">

<section class="page">
<h1>GALERI SERVICE A.S.E</h1>

<div class="gallery-grid" id="gallery">
    <!-- Foto lokal -->
    <img src="images/foto1.jpg" alt="Service 1">
    <img src="images/foto2.jpg" alt="Service 2">
    <img src="images/foto3.jpg" alt="Service 3">
    <img src="images/foto4.jpg" alt="Service 4">
    <img src="images/foto5.jpg" alt="Service 5">
    <img src="images/foto6.jpg" alt="Service 6">
    <img src="images/foto7.jpg" alt="Service 7">
    <img src="images/foto8.jpg" alt="Service 8">
    <img src="images/foto9.jpg" alt="Service 9">
    <img src="images/foto10.jpg" alt="Service 10">
    <img src="images/foto11.jpg" alt="Service 11">
    <img src="images/foto12.jpg" alt="Service 12">
</div>

<!-- Tombol Kembali -->
<a href="go:MENU_HIB" class="btn-menu">🎬 MENU HIBURAN</a>

<div class="hr-separator"></div>
<div class="footer">
    Aplikasi Resmi © ASEPI - Aplikasi Service Elektronik Panggilan Indonesia || ALL RIGHTS RESERVED
</div>
</section>

<!-- Modal Zoom + Watermark Diagonal -->
<div class="modal" id="zoomModal">
    <div class="modal-content">
        <img id="zoomImg" src="" alt="Zoom Foto">
        <div class="watermark">©Ali Service Elektronik</div>
    </div>
</div>

<script>
// Zoom foto dengan watermark diagonal bergerak
const modal = document.getElementById('zoomModal');
const zoomImg = document.getElementById('zoomImg');

document.querySelectorAll('.gallery-grid img').forEach(img => {
    img.addEventListener('click', () => {
        zoomImg.src = img.src;
        modal.style.display = 'flex';
    });
});

// Close modal saat klik background
modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.style.display = 'none';
});
</script>

</body>
</html>
